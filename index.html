<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivlit – Your Virtual Jar of Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #f3e8ff;
      color: #581c87;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    #app-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .gradient-bg {
      width: 200%;
      height: 200%;
      position: absolute;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle at 25% 25%, #d8b4fe, #f3e8ff 50%),
        radial-gradient(circle at 75% 75%, #fbcfe8, #f3e8ff 50%);
      opacity: 0.8;
      animation: rotate-gradient 40s linear infinite;
    }

    .sparkle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      animation: sparkle-animation 25s linear infinite;
      opacity: 0;
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px rgba(233, 213, 255, 0.6);
    }

    @keyframes rotate-gradient {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sparkle-animation {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="app-background">
    <div class="gradient-bg"></div>
  </div>
  <div id="root"></div>
  <script type="module">
    // Script to add sparkles to the background
    const sparkleContainer = document.querySelector('#app-background');
    if (sparkleContainer) {
      for (let i = 0; i < 50; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${Math.random() * 100}vw`;
        sparkle.style.top = `${Math.random() * 100}vh`;
        sparkle.style.animationDelay = `${Math.random() * 25}s`;
        sparkle.style.animationDuration = `${Math.random() * 20 + 15}s`;
        sparkleContainer.appendChild(sparkle);
      }
    }

    // The original module script
    import "/index.tsx";
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
